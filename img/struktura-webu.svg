<svg width="680" height="520" viewBox="0 0 680 520" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Struktura webu — korpusová analýza</title>
  <desc>Hierarchický diagram: Corpus → List of Authors → tři větve: Literary-Cartographic Maps, Quantitative/Statistic Models, Corpus Mining</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #444; }
      .arr { stroke: #aaa; stroke-width: 0.5; fill: none; }

      /* c-gray */
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th { fill: #2C2C2A; }

      /* c-purple */
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th { fill: #26215C; }

      /* c-teal */
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th { fill: #04342C; }

      /* c-blue */
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th { fill: #042C53; }

      /* c-coral */
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th { fill: #4A1B0C; }

      .leaf-box { fill: none; stroke: #ccc; stroke-width: 0.5; }
      .divider { stroke: #ddd; stroke-width: 0.3; }
    </style>
  </defs>

  <!-- ROOT: Corpus -->
  <g class="c-gray">
    <rect x="270" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Corpus</text>
  </g>

  <!-- LEVEL 2: List of Authors -->
  <line x1="340" y1="64" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>
  <g class="c-purple">
    <rect x="240" y="98" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="120" text-anchor="middle" dominant-baseline="central">List of authors</text>
  </g>

  <!-- Branch connectors -->
  <line x1="340" y1="142" x2="340" y2="166" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="166" x2="570" y2="166" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="166" x2="110" y2="190" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="166" x2="340" y2="190" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="166" x2="570" y2="190" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- LEVEL 3 LEFT -->
  <g class="c-teal">
    <rect x="30" y="190" width="160" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="110" y="208" text-anchor="middle" dominant-baseline="central">Literary-cartographic</text>
    <text class="th" x="110" y="226" text-anchor="middle" dominant-baseline="central">maps</text>
  </g>

  <!-- LEVEL 3 MID -->
  <g class="c-blue">
    <rect x="250" y="190" width="180" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="208" text-anchor="middle" dominant-baseline="central">Quantitative/statistic</text>
    <text class="th" x="340" y="226" text-anchor="middle" dominant-baseline="central">models</text>
  </g>

  <!-- LEVEL 3 RIGHT -->
  <g class="c-coral">
    <rect x="490" y="190" width="160" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="570" y="215" text-anchor="middle" dominant-baseline="central">Corpus mining</text>
  </g>

  <!-- Connectors to leaves -->
  <line x1="110" y1="240" x2="110" y2="264" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="240" x2="340" y2="264" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="240" x2="570" y2="264" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- LEAF LEFT -->
  <rect x="20" y="264" width="180" height="230" rx="8" class="leaf-box"/>
  <text class="ts" x="110" y="292" text-anchor="middle">Fictional topography</text>
  <line x1="40" y1="302" x2="180" y2="302" class="divider"/>
  <text class="ts" x="110" y="320" text-anchor="middle">Density of places</text>
  <line x1="40" y1="330" x2="180" y2="330" class="divider"/>
  <text class="ts" x="110" y="348" text-anchor="middle">Movement of characters</text>
  <line x1="40" y1="358" x2="180" y2="358" class="divider"/>
  <text class="ts" x="110" y="376" text-anchor="middle">Toponyms</text>
  <line x1="40" y1="386" x2="180" y2="386" class="divider"/>
  <text class="ts" x="110" y="404" text-anchor="middle">Prague and non-Prague</text>
  <line x1="40" y1="414" x2="180" y2="414" class="divider"/>
  <text class="ts" x="110" y="432" text-anchor="middle">Sacred spaces</text>
  <line x1="40" y1="442" x2="180" y2="442" class="divider"/>
  <text class="ts" x="110" y="460" text-anchor="middle">GIS</text>
  <line x1="40" y1="470" x2="180" y2="470" class="divider"/>
  <text class="ts" x="110" y="484" text-anchor="middle">Maps</text>

  <!-- LEAF MID -->
  <rect x="240" y="264" width="200" height="230" rx="8" class="leaf-box"/>
  <text class="ts" x="340" y="292" text-anchor="middle">Distributions of text levels</text>
  <line x1="255" y1="302" x2="425" y2="302" class="divider"/>
  <text class="ts" x="340" y="320" text-anchor="middle">Quant. dist. of segments</text>
  <line x1="255" y1="330" x2="425" y2="330" class="divider"/>
  <text class="ts" x="340" y="348" text-anchor="middle">Rhythm of narrative</text>
  <line x1="255" y1="358" x2="425" y2="358" class="divider"/>
  <text class="ts" x="340" y="376" text-anchor="middle">Sentiment analysis</text>
  <line x1="255" y1="386" x2="425" y2="386" class="divider"/>
  <text class="ts" x="340" y="404" text-anchor="middle">Entropy</text>
  <line x1="255" y1="414" x2="425" y2="414" class="divider"/>
  <text class="ts" x="340" y="432" text-anchor="middle">TTR</text>
  <line x1="255" y1="442" x2="425" y2="442" class="divider"/>
  <text class="ts" x="340" y="460" text-anchor="middle">Readability of texts</text>
  <line x1="255" y1="470" x2="425" y2="470" class="divider"/>
  <text class="ts" x="340" y="484" text-anchor="middle">Lexical diversity</text>

  <!-- LEAF RIGHT -->
  <rect x="480" y="264" width="180" height="230" rx="8" class="leaf-box"/>
  <text class="ts" x="570" y="292" text-anchor="middle">Concordance</text>
  <line x1="495" y1="302" x2="645" y2="302" class="divider"/>
  <text class="ts" x="570" y="320" text-anchor="middle">Collocation</text>
  <line x1="495" y1="330" x2="645" y2="330" class="divider"/>
  <text class="ts" x="570" y="348" text-anchor="middle">Frequency of lemmas</text>
  <line x1="495" y1="358" x2="645" y2="358" class="divider"/>
  <text class="ts" x="570" y="376" text-anchor="middle">Lemmas and their forms</text>
  <line x1="495" y1="386" x2="645" y2="386" class="divider"/>
  <text class="ts" x="570" y="404" text-anchor="middle">CQL</text>
</svg>
