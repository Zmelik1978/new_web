<svg width="696" height="780" viewBox="0 0 696 780" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Structure of data processing</title>
  <desc>Pipeline zpracování dat: AI+TXT → MorphoDiTa → Python → tabulky → SQL → PHP → HTML. Paralelně Python+JS analýzy → DB → HTML.</desc>

  <defs>
